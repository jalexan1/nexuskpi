<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>NexusKPI — Menú</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../styles/base.css"/>
  <style>
    .eyebrow  { font-size:.68rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:.3rem; }
    .page-title{ font-size:clamp(1.4rem,4vw,1.9rem); font-weight:800; line-height:1.1; }
    .page-sub  { color:var(--muted); font-size:.85rem; margin-top:.25rem; margin-bottom:1.75rem; }

    /* ── Hero header with warehouse scene ── */
    .hero-header {
      display:flex; align-items:center; justify-content:space-between;
      gap:1rem; margin-bottom:1.75rem;
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r-lg); padding:1.25rem 1.5rem;
      overflow:hidden; position:relative;
    }
    .hero-header::before {
      content:''; position:absolute; inset:0;
      background:radial-gradient(ellipse 50% 80% at 80% 50%, rgba(0,212,255,.04), transparent 70%);
      pointer-events:none;
    }
    .hero-text { flex-shrink:0; z-index:1; }
    .hero-text .eyebrow { margin-bottom:.3rem; }
    .hero-text .page-title { margin:0; }
    .hero-text .page-sub   { margin:.25rem 0 0; }
    .hero-scene {
      flex:1; min-width:0; height:130px;
      border-radius:var(--r); overflow:visible;
    }
    @media (max-width:767px)  { .hero-scene { display:none; } }
    @media (max-width:1023px) { .hero-scene { height:110px; } }

    /* Pipeline SVG — se adapta al ancho */
    .pipeline-wrap { width:100%; margin-bottom:2rem; overflow:visible; }

    /* En móvil el pipeline desaparece (muy pequeño para 8 nodos) */
    @media (max-width:767px) { .pipeline-wrap { display:none; } }

    /* KPI Grid */
    .kpi-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
      gap:1rem;
    }
    @media (max-width:767px)  { .kpi-grid { grid-template-columns:1fr 1fr; gap:.65rem; } }
    @media (max-width:479px)  { .kpi-grid { grid-template-columns:1fr; gap:.6rem; } }
    @media (min-width:1920px) { .kpi-grid { grid-template-columns:repeat(4,1fr); } }

    .kpi-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r-lg); padding:1.25rem;
      display:flex; flex-direction:column; gap:.6rem;
      transition:transform .2s,border-color .2s,box-shadow .2s;
      animation:fadeUp .4s ease both; position:relative; overflow:hidden;
    }
    .kpi-card.activo { border-color:rgba(0,212,255,.3); cursor:pointer; }
    .kpi-card.activo:hover { transform:translateY(-3px); box-shadow:0 8px 30px rgba(0,212,255,.15); border-color:var(--accent); }
    .kpi-card.activo:active { transform:translateY(-1px); }
    .kpi-card.bloqueado { opacity:.5; cursor:not-allowed; }
    .kpi-card.activo::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 80% 60% at 20% 20%,rgba(0,212,255,.05),transparent 70%); pointer-events:none; }
    .card-top { display:flex; align-items:flex-start; justify-content:space-between; }
    .kpi-icon { width:40px; height:40px; border-radius:10px; background:var(--surface2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0; }
    .kpi-card.activo .kpi-icon { background:rgba(0,212,255,.08); border-color:rgba(0,212,255,.3); }
    .kpi-code  { font-family:'Syne',sans-serif; font-size:.7rem; font-weight:700; color:var(--accent); letter-spacing:.1em; }
    .kpi-card.bloqueado .kpi-code { color:var(--muted); }
    .kpi-name  { font-family:'Syne',sans-serif; font-size:.9rem; font-weight:700; line-height:1.3; }
    .kpi-card-footer { display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:.6rem; border-top:1px solid var(--border); }
    .card-paso  { font-size:.66rem; color:var(--dim); }
    .card-arrow { font-size:.9rem; color:var(--accent); transition:transform .2s; }
    .kpi-card.activo:hover .card-arrow { transform:translateX(4px); }

    /* En móvil hacer cards más compactas */
    @media (max-width:479px) {
      .kpi-card { padding:1rem; gap:.45rem; }
      .kpi-icon { width:34px; height:34px; font-size:1rem; }
      .kpi-name { font-size:.82rem; }
    }

    /* Admin link */
    .admin-link {
      display:flex; align-items:center; gap:1rem;
      background:rgba(255,176,32,.05); border:1px solid rgba(255,176,32,.2);
      border-radius:var(--r); padding:.9rem 1.1rem;
      margin-top:1.25rem; cursor:pointer; transition:all .2s;
      animation:fadeUp .4s .45s ease both;
    }
    .admin-link:hover  { background:rgba(255,176,32,.1); transform:translateY(-1px); }
    .admin-link:active { transform:translateY(0); }
    .admin-link h4 { font-family:'Syne',sans-serif; font-size:.88rem; font-weight:700; color:var(--warn); margin-bottom:.1rem; }
    .admin-link p  { font-size:.76rem; color:var(--muted); }
    @media (max-width:479px) {
      .admin-link { flex-wrap:wrap; }
      .admin-link p { display:none; }
    }
  </style>
</head>
<body>
<div class="overlay" id="overlay"><div><div class="spinner"></div><p class="overlay-txt">Cargando…</p></div></div>
<div class="page">
  <header class="topbar">
    <a href="#" class="brand"><div class="brand-dot"></div>NexusKPI</a>
    <div class="topbar-spacer"></div>
    <div class="theme-bar">
      <button class="theme-btn" onclick="setTheme('')">🌙</button>
      <button class="theme-btn" onclick="setTheme('light')">☀️</button>
    </div>
    <div class="topbar-user" id="topbarUser"></div>
  </header>

  <main class="content">
    <div class="hero-header">
      <div class="hero-text">
        <div class="eyebrow">Plataforma de Indicadores</div>
        <h1 class="page-title">Cadena Logística</h1>
        <p class="page-sub">Monitorea cada etapa del proceso · del recibo al despacho</p>
      </div>
      <div class="hero-scene" id="warehouseScene" aria-hidden="true"></div>
    </div>

    <!-- Pipeline (solo desktop/tablet) -->
    <svg class="pipeline-wrap" viewBox="0 0 1100 72" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#00D4FF" stop-opacity=".8"/>
          <stop offset="100%" stop-color="#00FF88" stop-opacity=".6"/>
        </linearGradient>
        <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6Z" fill="rgba(0,212,255,.5)"/>
        </marker>
      </defs>
      <line x1="55" y1="36" x2="1045" y2="36" stroke="url(#pg)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
      <g id="pipeNodes"></g>
    </svg>

    <div class="kpi-grid" id="kpiGrid"></div>

    <a href="admin.html" class="admin-link" id="adminLink" style="display:none">
      <div style="font-size:1.3rem;width:36px;text-align:center;flex-shrink:0">⚙️</div>
      <div style="min-width:0">
        <h4>Panel de Administración</h4>
        <p>Cargar archivos Excel, gestionar usuarios y ver log de cargues</p>
      </div>
      <div style="margin-left:auto;color:var(--warn);font-size:1.1rem;flex-shrink:0">→</div>
    </a>
  </main>
</div>

<script src="../config/config.js"></script>
<script src="../utils/auth.js"></script>
<script>
  applyTheme();

  function buildPipeline() {
    const g    = document.getElementById('pipeNodes');
    const kpis = CONFIG.kpis;
    kpis.forEach((k, i) => {
      const x    = 55 + (i / (kpis.length - 1)) * 990;
      const vivo = k.activo;
      const c    = vivo ? '#00D4FF' : 'rgba(122,139,166,.35)';
      if (vivo) {
        g.innerHTML += `<circle cx="${x}" cy="36" r="20" fill="none" stroke="#00D4FF" stroke-width="1" opacity=".3">
          <animate attributeName="r" values="13;21;13" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".4;0;.4" dur="2s" repeatCount="indefinite"/>
        </circle>`;
      }
      g.innerHTML += `
        <circle cx="${x}" cy="36" r="12" fill="${vivo?'#00D4FF':'var(--surface2)'}" stroke="${c}" stroke-width="1.5"/>
        <text x="${x}" y="40" text-anchor="middle" font-size="8" fill="${vivo?'#06090F':'rgba(122,139,166,.4)'}" font-family="Syne" font-weight="700">${i+1}</text>
        <text x="${x}" y="60" text-anchor="middle" font-size="7" fill="${vivo?'rgba(0,212,255,.7)':'rgba(122,139,166,.3)'}" font-family="DM Sans">${k.code.split('-')[1]}</text>`;
    });
  }

  function buildGrid() {
    document.getElementById('kpiGrid').innerHTML = CONFIG.kpis.map((k, i) => {
      const cls  = k.activo ? 'activo' : 'bloqueado';
      const wrap = k.activo
        ? `<a href="${k.href}" class="kpi-card ${cls}" style="animation-delay:${.05*(i+1)}s">`
        : `<div class="kpi-card ${cls}" style="animation-delay:${.05*(i+1)}s">`;
      const close = k.activo ? '</a>' : '</div>';
      return `${wrap}
        <div class="card-top">
          <div class="kpi-icon">${k.icon}</div>
          <span class="badge ${k.activo?'badge-ok':'badge-warn'}">${k.activo?'En vivo':'Próximo'}</span>
        </div>
        <div class="kpi-code">${k.code}</div>
        <div class="kpi-name">${k.name}</div>
        <div class="kpi-card-footer">
          <span class="card-paso">Paso ${i+1} de 8</span>
          ${k.activo ? '<span class="card-arrow">→</span>' : '<span style="font-size:.75rem;color:var(--dim)">🔒</span>'}
        </div>
      ${close}`;
    }).join('');
  }

  window.addEventListener('load', async () => {
    const user = await checkAuth(); if (!user) return;
    renderUser();
    buildPipeline();
    buildGrid();
    if (getRole() === 'admin') document.getElementById('adminLink').style.display = 'flex';
    const ol = document.getElementById('overlay');
    setTimeout(() => ol.classList.add('out'), 150);
    setTimeout(() => ol.remove(), 550);
    // Init warehouse scene (inline)
    _initWarehouseScene();
  });

  function _initWarehouseScene() {
    const host = document.getElementById('warehouseScene');
    if (!host) return;
    host.innerHTML = `
    <svg viewBox="0 0 900 150" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:100%;overflow:visible" aria-hidden="true">
      <defs>
        <style>
          @keyframes ws-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
          @keyframes ws-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
          @keyframes ws-pulse{0%,100%{opacity:.35}50%{opacity:1}}
          @keyframes ws-shimmer{0%,100%{opacity:.25}50%{opacity:.8}}
          @keyframes ws-scan{0%,100%{opacity:0}35%,65%{opacity:.9}}
          @keyframes ws-cursor{0%,100%{opacity:1}50%{opacity:0}}
          @keyframes ws-leg-l{0%,100%{transform:rotate(0deg)}50%{transform:rotate(9deg)}}
          @keyframes ws-leg-r{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-9deg)}}
          @keyframes ws-arm-l{0%,100%{transform:rotate(0deg)}50%{transform:rotate(13deg)}}
          @keyframes ws-arm-r{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-16deg)}}
          @keyframes ws-door{0%,30%{transform:scaleX(1)}55%,80%{transform:scaleX(.12)}100%{transform:scaleX(1)}}
          @keyframes ws-convey{0%{stroke-dashoffset:0}100%{stroke-dashoffset:-20}}
          @keyframes ws-trkin{0%{transform:translateX(55px);opacity:0}100%{transform:translateX(0);opacity:1}}
          @keyframes ws-lights{0%,100%{opacity:.5}50%{opacity:1}}
        </style>
        <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#1a4a70"/><stop offset="100%" stop-color="#0a1e33"/>
        </linearGradient>
        <linearGradient id="wtr" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#1a3a5a"/><stop offset="100%" stop-color="#0d1f30"/>
        </linearGradient>
      </defs>

      <!-- floor -->
      <rect x="0" y="115" width="900" height="35" fill="rgba(0,212,255,.03)" rx="1"/>
      <line x1="0" y1="115" x2="900" y2="115" stroke="rgba(0,212,255,.1)" stroke-width=".8"/>
      <!-- dividers -->
      <line x1="220" y1="8" x2="220" y2="142" stroke="rgba(0,212,255,.07)" stroke-width="1" stroke-dasharray="3,4"/>
      <line x1="450" y1="8" x2="450" y2="142" stroke="rgba(0,212,255,.07)" stroke-width="1" stroke-dasharray="3,4"/>
      <line x1="670" y1="8" x2="670" y2="142" stroke="rgba(0,212,255,.07)" stroke-width="1" stroke-dasharray="3,4"/>
      <!-- conveyor belt -->
      <line x1="220" y1="130" x2="450" y2="130" stroke="rgba(0,212,255,.13)" stroke-width="3" stroke-dasharray="8,4" style="animation:ws-convey .8s linear infinite"/>
      <line x1="450" y1="130" x2="670" y2="130" stroke="rgba(0,212,255,.1)" stroke-width="3" stroke-dasharray="8,4" style="animation:ws-convey .8s .3s linear infinite"/>

      <!-- labels -->
      <text x="110" y="11" text-anchor="middle" font-family="Syne,Arial,sans-serif" font-size="6.5" font-weight="700" fill="rgba(0,212,255,.5)" letter-spacing=".1em">① RECIBO</text>
      <text x="335" y="11" text-anchor="middle" font-family="Syne,Arial,sans-serif" font-size="6.5" font-weight="700" fill="rgba(0,212,255,.5)" letter-spacing=".1em">② INVENTARIO</text>
      <text x="560" y="11" text-anchor="middle" font-family="Syne,Arial,sans-serif" font-size="6.5" font-weight="700" fill="rgba(0,212,255,.5)" letter-spacing=".1em">③ PICKING</text>
      <text x="785" y="11" text-anchor="middle" font-family="Syne,Arial,sans-serif" font-size="6.5" font-weight="700" fill="rgba(0,212,255,.5)" letter-spacing=".1em">④ DESPACHO</text>

      <!-- ═══ SCENE 1: RECIBO ═══ -->
      <g style="animation:ws-trkin .9s .2s cubic-bezier(.34,1.56,.64,1) both">
        <!-- trailer -->
        <rect x="6" y="68" width="90" height="47" fill="url(#wtr)" stroke="#00D4FF" stroke-width="1.2" rx="2"/>
        <!-- cab -->
        <rect x="96" y="80" width="40" height="35" fill="#1e3a55" stroke="#00D4FF" stroke-width="1.2" rx="2"/>
        <rect x="100" y="83" width="30" height="17" fill="rgba(0,212,255,.13)" stroke="rgba(0,212,255,.35)" stroke-width=".8" rx="1"/>
        <path d="M136 80 L143 85 L143 115 L136 115Z" fill="#152c42" stroke="rgba(0,212,255,.5)" stroke-width=".8"/>
        <!-- wheels -->
        <circle cx="28" cy="116" r="8" fill="#080e18" stroke="rgba(0,212,255,.55)" stroke-width="1.2"/>
        <circle cx="28" cy="116" r="3.5" fill="rgba(0,212,255,.18)"/>
        <circle cx="70" cy="116" r="8" fill="#080e18" stroke="rgba(0,212,255,.55)" stroke-width="1.2"/>
        <circle cx="70" cy="116" r="3.5" fill="rgba(0,212,255,.18)"/>
        <circle cx="120" cy="116" r="7" fill="#080e18" stroke="rgba(0,212,255,.55)" stroke-width="1.2"/>
        <circle cx="120" cy="116" r="3" fill="rgba(0,212,255,.18)"/>
        <!-- headlights -->
        <rect x="141" y="86" width="4" height="5" fill="rgba(255,220,60,.8)" rx="1" style="animation:ws-lights 1.4s ease-in-out infinite"/>
        <rect x="141" y="99" width="4" height="4" fill="rgba(255,80,60,.6)" rx="1"/>
        <!-- door opening -->
        <rect x="6" y="68" width="13" height="47" fill="#0a1e33" stroke="rgba(0,212,255,.5)" stroke-width="1" style="transform-origin:19px 68px;animation:ws-door 3s 1s ease-in-out infinite"/>
        <!-- boxes inside truck -->
        <rect x="22" y="80" width="17" height="14" fill="url(#wbg)" stroke="rgba(0,212,255,.4)" stroke-width=".7" rx="1"/>
        <rect x="41" y="80" width="17" height="14" fill="url(#wbg)" stroke="rgba(0,212,255,.4)" stroke-width=".7" rx="1"/>
        <rect x="60" y="80" width="17" height="14" fill="url(#wbg)" stroke="rgba(0,212,255,.4)" stroke-width=".7" rx="1"/>
        <rect x="31" y="96" width="17" height="14" fill="url(#wbg)" stroke="rgba(0,212,255,.4)" stroke-width=".7" rx="1"/>
        <rect x="50" y="96" width="17" height="14" fill="url(#wbg)" stroke="rgba(0,212,255,.4)" stroke-width=".7" rx="1"/>
      </g>
      <!-- floating box being unloaded -->
      <g style="animation:ws-float 1.8s .5s ease-in-out infinite">
        <rect x="152" y="82" width="19" height="17" fill="url(#wbg)" stroke="#00D4FF" stroke-width="1.3" rx="1.5"/>
        <line x1="152" y1="90.5" x2="171" y2="90.5" stroke="rgba(0,212,255,.4)" stroke-width=".6"/>
        <line x1="161.5" y1="82" x2="161.5" y2="99" stroke="rgba(0,212,255,.4)" stroke-width=".6"/>
      </g>
      <!-- box stack on floor -->
      <rect x="168" y="100" width="17" height="15" fill="url(#wbg)" stroke="rgba(0,212,255,.45)" stroke-width=".8" rx="1"/>
      <rect x="170" y="88" width="15" height="12" fill="url(#wbg)" stroke="rgba(0,212,255,.55)" stroke-width=".8" rx="1"/>
      <rect x="172" y="78" width="13" height="10" fill="url(#wbg)" stroke="#00D4FF" stroke-width=".8" rx="1"/>
      <!-- worker 1 -->
      <g style="animation:ws-bob 1.6s ease-in-out infinite">
        <rect x="184" y="103" width="5" height="12" fill="#1a2a3e" rx="2" style="transform-origin:184px 103px;animation:ws-leg-l .8s ease-in-out infinite"/>

        <circle cx="190" cy="84" r="6.5" fill="#E8C49A"/>
        <path d="M183.5 81 Q190 76.5 196.5 81" fill="#3a2010"/>
        <ellipse cx="190" cy="78.5" rx="7.5" ry="4" fill="#FFB020" opacity=".9"/>
        <circle cx="187.5" cy="84" r="1" fill="#3a2010"/>
        <circle cx="192.5" cy="84" r="1" fill="#3a2010"/>
        <rect x="176" y="93" width="7" height="3" fill="#E8C49A" rx="1.5" style="transform-origin:182px 94px;animation:ws-arm-l .8s ease-in-out infinite"/>
        <rect x="199" y="93" width="7" height="3" fill="#E8C49A" rx="1.5" style="transform-origin:199px 94px;animation:ws-arm-r .8s ease-in-out infinite"/>
      </g>

      <!-- ═══ SCENE 2: INVENTARIO ═══ -->
      <!-- shelves -->
      <rect x="228" y="50" width="62" height="65" fill="rgba(13,20,32,.85)" stroke="rgba(0,212,255,.18)" stroke-width="1" rx="2"/>
      <line x1="228" y1="70" x2="290" y2="70" stroke="rgba(0,212,255,.22)" stroke-width="1.2"/>
      <line x1="228" y1="90" x2="290" y2="90" stroke="rgba(0,212,255,.22)" stroke-width="1.2"/>
      <line x1="228" y1="110" x2="290" y2="110" stroke="rgba(0,212,255,.22)" stroke-width="1.2"/>
      <rect x="231" y="56" width="12" height="13" fill="url(#wbg)" stroke="rgba(0,212,255,.45)" stroke-width=".7" rx="1"/>
      <rect x="245" y="56" width="12" height="13" fill="url(#wbg)" stroke="rgba(0,212,255,.45)" stroke-width=".7" rx="1"/>
      <rect x="259" y="58" width="12" height="11" fill="url(#wbg)" stroke="rgba(0,212,255,.45)" stroke-width=".7" rx="1"/>
      <rect x="273" y="56" width="12" height="13" fill="url(#wbg)" stroke="rgba(0,212,255,.45)" stroke-width=".7" rx="1"/>
      <rect x="231" y="75" width="14" height="14" fill="url(#wbg)" stroke="rgba(0,212,255,.45)" stroke-width=".7" rx="1"/>
      <rect x="247" y="75" width="12" height="14" fill="url(#wbg)" stroke="rgba(0,212,255,.45)" stroke-width=".7" rx="1"/>
      <rect x="261" y="77" width="12" height="12" fill="url(#wbg)" stroke="rgba(0,212,255,.45)" stroke-width=".7" rx="1"/>
      <rect x="231" y="95" width="12" height="14" fill="url(#wbg)" stroke="rgba(0,212,255,.45)" stroke-width=".7" rx="1"/>
      <rect x="245" y="95" width="14" height="14" fill="url(#wbg)" stroke="rgba(0,212,255,.45)" stroke-width=".7" rx="1"/>
      <rect x="261" y="95" width="12" height="14" fill="url(#wbg)" stroke="rgba(0,212,255,.45)" stroke-width=".7" rx="1"/>
      <!-- desk -->
      <rect x="308" y="105" width="58" height="4" fill="#1a3a5c" stroke="rgba(0,212,255,.28)" stroke-width=".8" rx="1"/>
      <rect x="311" y="109" width="4" height="6" fill="#1a3a5c" rx="1"/>
      <rect x="358" y="109" width="4" height="6" fill="#1a3a5c" rx="1"/>
      <!-- monitor -->
      <rect x="318" y="82" width="34" height="23" fill="#0d1420" stroke="#00D4FF" stroke-width="1.2" rx="2"/>
      <rect x="320" y="84" width="30" height="19" fill="rgba(0,212,255,.07)" rx="1"/>
