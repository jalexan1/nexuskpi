<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>NexusKPI — Menú</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../styles/base.css"/>
  <style>
    .eyebrow  { font-size:.68rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:600; margin-bottom:.3rem; }
    .page-title{ font-size:clamp(1.4rem,4vw,1.9rem); font-weight:800; line-height:1.1; }
    .page-sub  { color:var(--muted); font-size:.85rem; margin-top:.25rem; margin-bottom:1.75rem; }

    /* ── Hero header with warehouse scene ── */
    .hero-header {
      display:flex; align-items:center; justify-content:space-between;
      gap:1rem; margin-bottom:1.75rem;
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r-lg); padding:1.25rem 1.5rem;
      overflow:hidden; position:relative;
    }
    .hero-header::before {
      content:''; position:absolute; inset:0;
      background:radial-gradient(ellipse 50% 80% at 80% 50%, rgba(0,212,255,.04), transparent 70%);
      pointer-events:none;
    }
    .hero-text { flex-shrink:0; z-index:1; }
    .hero-text .eyebrow { margin-bottom:.3rem; }
    .hero-text .page-title { margin:0; }
    .hero-text .page-sub   { margin:.25rem 0 0; }
    .hero-scene {
      flex:1; min-width:0; height:130px;
      border-radius:var(--r); overflow:visible;
    }
    @media (max-width:767px)  { .hero-scene { display:none; } }
    @media (max-width:1023px) { .hero-scene { height:110px; } }

    /* Pipeline SVG — se adapta al ancho */
    .pipeline-wrap { width:100%; margin-bottom:2rem; overflow:visible; }

    /* En móvil el pipeline desaparece (muy pequeño para 8 nodos) */
    @media (max-width:767px) { .pipeline-wrap { display:none; } }

    /* KPI Grid */
    .kpi-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill, minmax(240px,1fr));
      gap:1rem;
    }
    @media (max-width:767px)  { .kpi-grid { grid-template-columns:1fr 1fr; gap:.65rem; } }
    @media (max-width:479px)  { .kpi-grid { grid-template-columns:1fr; gap:.6rem; } }
    @media (min-width:1920px) { .kpi-grid { grid-template-columns:repeat(4,1fr); } }

    .kpi-card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--r-lg); padding:1.25rem;
      display:flex; flex-direction:column; gap:.6rem;
      transition:transform .2s,border-color .2s,box-shadow .2s;
      animation:fadeUp .4s ease both; position:relative; overflow:hidden;
    }
    .kpi-card.activo { border-color:rgba(0,212,255,.3); cursor:pointer; }
    .kpi-card.activo:hover { transform:translateY(-3px); box-shadow:0 8px 30px rgba(0,212,255,.15); border-color:var(--accent); }
    .kpi-card.activo:active { transform:translateY(-1px); }
    .kpi-card.bloqueado { opacity:.5; cursor:not-allowed; }
    .kpi-card.activo::before { content:''; position:absolute; inset:0; background:radial-gradient(ellipse 80% 60% at 20% 20%,rgba(0,212,255,.05),transparent 70%); pointer-events:none; }
    .card-top { display:flex; align-items:flex-start; justify-content:space-between; }
    .kpi-icon { width:40px; height:40px; border-radius:10px; background:var(--surface2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:1.2rem; flex-shrink:0; }
    .kpi-card.activo .kpi-icon { background:rgba(0,212,255,.08); border-color:rgba(0,212,255,.3); }
    .kpi-code  { font-family:'Syne',sans-serif; font-size:.7rem; font-weight:700; color:var(--accent); letter-spacing:.1em; }
    .kpi-card.bloqueado .kpi-code { color:var(--muted); }
    .kpi-name  { font-family:'Syne',sans-serif; font-size:.9rem; font-weight:700; line-height:1.3; }
    .kpi-card-footer { display:flex; align-items:center; justify-content:space-between; margin-top:auto; padding-top:.6rem; border-top:1px solid var(--border); }
    .card-paso  { font-size:.66rem; color:var(--dim); }
    .card-arrow { font-size:.9rem; color:var(--accent); transition:transform .2s; }
    .kpi-card.activo:hover .card-arrow { transform:translateX(4px); }

    /* En móvil hacer cards más compactas */
    @media (max-width:479px) {
      .kpi-card { padding:1rem; gap:.45rem; }
      .kpi-icon { width:34px; height:34px; font-size:1rem; }
      .kpi-name { font-size:.82rem; }
    }

    /* Admin link */
    .admin-link {
      display:flex; align-items:center; gap:1rem;
      background:rgba(255,176,32,.05); border:1px solid rgba(255,176,32,.2);
      border-radius:var(--r); padding:.9rem 1.1rem;
      margin-top:1.25rem; cursor:pointer; transition:all .2s;
      animation:fadeUp .4s .45s ease both;
    }
    .admin-link:hover  { background:rgba(255,176,32,.1); transform:translateY(-1px); }
    .admin-link:active { transform:translateY(0); }
    .admin-link h4 { font-family:'Syne',sans-serif; font-size:.88rem; font-weight:700; color:var(--warn); margin-bottom:.1rem; }
    .admin-link p  { font-size:.76rem; color:var(--muted); }
    @media (max-width:479px) {
      .admin-link { flex-wrap:wrap; }
      .admin-link p { display:none; }
    }
  </style>
</head>
<body>
<div class="overlay" id="overlay"><div><div class="spinner"></div><p class="overlay-txt">Cargando…</p></div></div>
<div class="page">
  <header class="topbar">
    <a href="#" class="brand"><div class="brand-dot"></div>NexusKPI</a>
    <div class="topbar-spacer"></div>
    <div class="theme-bar">
      <button class="theme-btn" onclick="setTheme('')">🌙</button>
      <button class="theme-btn" onclick="setTheme('light')">☀️</button>
    </div>
    <div class="topbar-user" id="topbarUser"></div>
  </header>

  <main class="content">
    <div class="hero-header">
      <div class="hero-text">
        <div class="eyebrow">Plataforma de Indicadores</div>
        <h1 class="page-title">Cadena Logística</h1>
        <p class="page-sub">Monitorea cada etapa del proceso · del recibo al despacho</p>
      </div>
      <div class="hero-scene" id="warehouseScene" aria-hidden="true"></div>
    </div>

    <!-- Pipeline (solo desktop/tablet) -->
    <svg class="pipeline-wrap" viewBox="0 0 1100 72" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="pg" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="#00D4FF" stop-opacity=".8"/>
          <stop offset="100%" stop-color="#00FF88" stop-opacity=".6"/>
        </linearGradient>
        <marker id="arr" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6Z" fill="rgba(0,212,255,.5)"/>
        </marker>
      </defs>
      <line x1="55" y1="36" x2="1045" y2="36" stroke="url(#pg)" stroke-width="1.5" stroke-dasharray="5,3" marker-end="url(#arr)"/>
      <g id="pipeNodes"></g>
    </svg>

    <div class="kpi-grid" id="kpiGrid"></div>

    <a href="admin.html" class="admin-link" id="adminLink" style="display:none">
      <div style="font-size:1.3rem;width:36px;text-align:center;flex-shrink:0">⚙️</div>
      <div style="min-width:0">
        <h4>Panel de Administración</h4>
        <p>Cargar archivos Excel, gestionar usuarios y ver log de cargues</p>
      </div>
      <div style="margin-left:auto;color:var(--warn);font-size:1.1rem;flex-shrink:0">→</div>
    </a>
  </main>
</div>

<script src="../config/config.js"></script>
<script src="../utils/auth.js"></script>
<script>
  applyTheme();

  function buildPipeline() {
    const g    = document.getElementById('pipeNodes');
    const kpis = CONFIG.kpis;
    kpis.forEach((k, i) => {
      const x    = 55 + (i / (kpis.length - 1)) * 990;
      const vivo = k.activo;
      const c    = vivo ? '#00D4FF' : 'rgba(122,139,166,.35)';
      if (vivo) {
        g.innerHTML += `<circle cx="${x}" cy="36" r="20" fill="none" stroke="#00D4FF" stroke-width="1" opacity=".3">
          <animate attributeName="r" values="13;21;13" dur="2s" repeatCount="indefinite"/>
          <animate attributeName="opacity" values=".4;0;.4" dur="2s" repeatCount="indefinite"/>
        </circle>`;
      }
      g.innerHTML += `
        <circle cx="${x}" cy="36" r="12" fill="${vivo?'#00D4FF':'var(--surface2)'}" stroke="${c}" stroke-width="1.5"/>
        <text x="${x}" y="40" text-anchor="middle" font-size="8" fill="${vivo?'#06090F':'rgba(122,139,166,.4)'}" font-family="Syne" font-weight="700">${i+1}</text>
        <text x="${x}" y="60" text-anchor="middle" font-size="7" fill="${vivo?'rgba(0,212,255,.7)':'rgba(122,139,166,.3)'}" font-family="DM Sans">${k.code.split('-')[1]}</text>`;
    });
  }

  function buildGrid() {
    document.getElementById('kpiGrid').innerHTML = CONFIG.kpis.map((k, i) => {
      const cls  = k.activo ? 'activo' : 'bloqueado';
      const wrap = k.activo
        ? `<a href="${k.href}" class="kpi-card ${cls}" style="animation-delay:${.05*(i+1)}s">`
        : `<div class="kpi-card ${cls}" style="animation-delay:${.05*(i+1)}s">`;
      const close = k.activo ? '</a>' : '</div>';
      return `${wrap}
        <div class="card-top">
          <div class="kpi-icon">${k.icon}</div>
          <span class="badge ${k.activo?'badge-ok':'badge-warn'}">${k.activo?'En vivo':'Próximo'}</span>
        </div>
        <div class="kpi-code">${k.code}</div>
        <div class="kpi-name">${k.name}</div>
        <div class="kpi-card-footer">
          <span class="card-paso">Paso ${i+1} de 8</span>
          ${k.activo ? '<span class="card-arrow">→</span>' : '<span style="font-size:.75rem;color:var(--dim)">🔒</span>'}
        </div>
      ${close}`;
    }).join('');
  }

  window.addEventListener('load', async () => {
    const user = await checkAuth(); if (!user) return;
    renderUser();
    buildPipeline();
    buildGrid();
    if (getRole() === 'admin') document.getElementById('adminLink').style.display = 'flex';
    const ol = document.getElementById('overlay');
    setTimeout(() => ol.classList.add('out'), 150);
    setTimeout(() => ol.remove(), 550);
    // Init warehouse scene animation
    if (typeof WarehouseScene !== 'undefined') WarehouseScene.init('warehouseScene');
  });
</script>
<script src="../components/warehouse-scene.js"></script>
</body>
</html>
