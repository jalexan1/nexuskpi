<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>NexusKPI — Operatividad · Picking</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../styles/base.css"/>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    :root{ --op-accent:#F2994A; --op-accent2:#B5651D; }
    .content{padding:1.5rem;max-width:1280px;margin:0 auto;width:100%}
    .eyebrow{font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--op-accent);font-weight:600;margin-bottom:.3rem}
    .pg-hdr h1{font-size:clamp(1.2rem,3vw,1.5rem);font-weight:800}
    .pg-hdr p{color:var(--muted);font-size:.82rem;margin-top:.25rem;margin-bottom:1.25rem}

    .filtros{display:flex;gap:.6rem;flex-wrap:wrap;align-items:center;margin-bottom:1.25rem;background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:.85rem 1rem}
    .filtros select,.filtros input{background:var(--surface2);border:1px solid var(--border2);border-radius:var(--r-sm);color:var(--text);font-family:'DM Sans',sans-serif;font-size:.8rem;padding:.4rem .65rem;outline:none;cursor:pointer}
    .filtros label{font-size:.66rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-right:.25rem}

    .metrics-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:.85rem;margin-bottom:1.25rem}
    .metric-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.1rem;animation:fadeUp .35s ease both}
    .metric-label{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:.4rem}
    .metric-value{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800}

    .chart-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:1.1rem;height:340px;display:flex;flex-direction:column;margin-bottom:1.25rem}
    .chart-card h3{font-size:.85rem;font-weight:700;margin-bottom:.6rem}
    .chart-wrap{flex:1;position:relative}

    .tbl-wrap{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
    .tbl-scroll{overflow-x:auto;max-height:480px;overflow-y:auto}
    table{width:100%;border-collapse:collapse;font-size:.78rem}
    thead th{text-align:left;padding:.5rem .7rem;font-size:.62rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--border);background:var(--surface);position:sticky;top:0;white-space:nowrap}
    tbody tr{border-bottom:1px solid var(--border)}
    tbody tr:hover{background:var(--surface2)}
    tbody td{padding:.42rem .7rem}
  </style>
</head>
<body>
<div class="overlay" id="overlay"><div><div class="spinner"></div><p class="overlay-txt">Cargando…</p></div></div>
<div class="page">
  <header class="topbar">
    <a href="op_dashboard_menu.html" class="brand"><div class="brand-dot"></div>NexusKPI</a>
    <span class="topbar-sep">/</span><span class="topbar-title" style="color:var(--op-accent)">🚚 Operatividad</span>
    <span class="topbar-sep">/</span><span class="topbar-title">🧰 Picking</span>
    <div class="topbar-spacer"></div>
    <a href="op_dashboard_menu.html" class="btn btn-sm">← Dashboard</a>
    <div class="theme-bar"><button class="theme-btn" onclick="setTheme('')">🌙</button><button class="theme-btn" onclick="setTheme('light')">☀️</button></div>
    <div class="topbar-user" id="topbarUser"></div>
  </header>

  <main class="content">
    <div class="pg-hdr">
      <div class="eyebrow">🧰 Operatividad · Picking</div>
      <h1>Picking</h1>
      <p>Comprobantes, líneas de picking y cajas alistadas (ALISTAMIENTO + PICKING WMS).</p>
    </div>

    <div class="filtros">
      <div><label>Mes</label><select id="fMes" onchange="render()"></select></div>
      <div><label>Cliente/Tercero</label><select id="fCliente" onchange="render()"><option value="">Todos</option></select></div>
    </div>

    <div class="metrics-grid" id="metricsGrid"></div>

    <div class="chart-card">
      <h3>Comprobantes Alistados por Día</h3>
      <div class="chart-wrap"><canvas id="cDia"></canvas></div>
    </div>
    <div class="chart-card">
      <h3>Líneas de Picking WMS por Día</h3>
      <div class="chart-wrap"><canvas id="cLineas"></canvas></div>
    </div>

    <div class="tbl-wrap">
      <div class="tbl-scroll">
        <table>
          <thead><tr><th>Día</th><th>Comprobante</th><th>Tercero</th><th>SKU</th><th>Cajas</th><th>Operario</th><th>Inicio</th><th>Fin</th><th>Estado</th></tr></thead>
          <tbody id="tblBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script src="../config/config.js"></script>
<script src="../utils/auth.js"></script>
<script>
applyTheme();
let alistamiento = [], pickingWms = [];
let charts = {};
function destroyChart(id){ if(charts[id]){ charts[id].destroy(); delete charts[id]; } }

function poblarFiltros() {
  const meses = [...new Set(alistamiento.map(r=>r.periodo_id))].sort();
  const sel = document.getElementById('fMes');
  sel.innerHTML = `<option value="">Todos los meses</option>` + meses.map(m=>{
    const label = CONFIG.meses.find(x=>x.id===m)?.label || m;
    return `<option value="${m}">${label}</option>`;
  }).join('');
  if (meses.length) sel.value = meses[meses.length-1];

  const clientes = [...new Set(alistamiento.map(r=>r.nombre_tercero).filter(Boolean))].sort();
  document.getElementById('fCliente').innerHTML = `<option value="">Todos</option>` + clientes.map(c=>`<option value="${c}">${c}</option>`).join('');
}

function filtrarAlistamiento() {
  const mes = document.getElementById('fMes').value;
  const cliente = document.getElementById('fCliente').value;
  return alistamiento.filter(r => (!mes || r.periodo_id===mes) && (!cliente || r.nombre_tercero===cliente));
}
function filtrarPickingWms() {
  const mes = document.getElementById('fMes').value;
  return pickingWms.filter(r => !mes || r.periodo_id===mes);
}

function render() {
  const ali = filtrarAlistamiento();
  const pk = filtrarPickingWms();

  const comprobantes = new Set(ali.map(r=>r.comprobante).filter(Boolean));
  const cajas = ali.reduce((s,r)=>s+(r.cantidad_cajas||0),0);
  const lineasWms = pk.length;

  document.getElementById('metricsGrid').innerHTML = `
    <div class="metric-card" style="animation-delay:.02s"><div class="metric-label">Comprobantes</div><div class="metric-value">${comprobantes.size}</div></div>
    <div class="metric-card" style="animation-delay:.05s"><div class="metric-label">Cajas Alistadas</div><div class="metric-value">${cajas.toLocaleString('es-CO')}</div></div>
    <div class="metric-card" style="animation-delay:.08s"><div class="metric-label">Líneas Picking WMS</div><div class="metric-value">${lineasWms.toLocaleString('es-CO')}</div></div>
    <div class="metric-card" style="animation-delay:.11s"><div class="metric-label">SKUs Distintos</div><div class="metric-value">${new Set(ali.map(r=>r.sku).filter(Boolean)).size}</div></div>
  `;

  const porDiaComprob = {};
  ali.forEach(r => { if(!r.dia) return; porDiaComprob[r.dia] = porDiaComprob[r.dia] || new Set(); porDiaComprob[r.dia].add(r.comprobante); });
  const diasC = Object.keys(porDiaComprob).sort();
  destroyChart('cDia');
  charts.cDia = new Chart(document.getElementById('cDia'), {
    type:'line',
    data:{ labels:diasC, datasets:[{ label:'Comprobantes', data:diasC.map(d=>porDiaComprob[d].size), borderColor:'#F2994A', backgroundColor:'rgba(242,153,74,.15)', fill:true, tension:.3 }] },
    options:{ responsive:true, maintainAspectRatio:false, scales:{ x:{grid:{color:'rgba(255,255,255,.04)'}}, y:{grid:{color:'rgba(255,255,255,.04)'}} } }
  });

  const porDiaLineas = {};
  pk.forEach(r => { if(!r.fecha_registro) return; porDiaLineas[r.fecha_registro] = (porDiaLineas[r.fecha_registro]||0)+1; });
  const diasL = Object.keys(porDiaLineas).sort();
  destroyChart('cLineas');
  charts.cLineas = new Chart(document.getElementById('cLineas'), {
    type:'bar',
    data:{ labels:diasL, datasets:[{ label:'Líneas Picking WMS', data:diasL.map(d=>porDiaLineas[d]), backgroundColor:'#00D4FF' }] },
    options:{ responsive:true, maintainAspectRatio:false, scales:{ x:{grid:{color:'rgba(255,255,255,.04)'}}, y:{grid:{color:'rgba(255,255,255,.04)'}} } }
  });

  document.getElementById('tblBody').innerHTML = ali.slice(0,500).map(r=>`<tr>
    <td>${r.dia||'—'}</td><td>${r.comprobante||'—'}</td><td>${r.nombre_tercero||'—'}</td><td>${r.sku||'—'}</td>
    <td>${(r.cantidad_cajas||0).toLocaleString('es-CO')}</td><td>${r.operario||'—'}</td>
    <td>${r.inicio_picking||'—'}</td><td>${r.fin_picking||'—'}</td><td>${r.estado||'—'}</td>
  </tr>`).join('') || `<tr><td colspan="9" style="text-align:center;color:var(--muted);padding:1rem">Sin datos para los filtros seleccionados.</td></tr>`;
}

async function cargarDatos() {
  try {
    const [a,p] = await Promise.all([
      sb.rest('GET','op_alistamiento?order=periodo_id.asc,dia.asc'),
      sb.rest('GET','op_picking_wms?order=periodo_id.asc,fecha_registro.asc'),
    ]);
    alistamiento = a||[]; pickingWms = p||[];
  } catch(e) { alistamiento=[]; pickingWms=[]; console.error(e); }
  poblarFiltros();
  render();
}

window.addEventListener('load', async () => {
  const user = await checkAuth(); if (!user) return;
  renderUser();
  await cargarDatos();
  const ol = document.getElementById('overlay');
  setTimeout(() => ol.classList.add('out'), 200);
  setTimeout(() => ol.remove(), 600);
});
</script>
</body>
</html>
